[project]
name = "loan-status-prediction"
version = "0.1.0"
description = "Reusable ML pipeline for loan status prediction."
requires-python = ">=3.11"
dependencies = [
  "pandas==2.3.3",
  "numpy==2.4.1",
  "scikit-learn==1.9.0",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "scipy==1.17.0",
  "statsmodels==0.14.6",
  "imbalanced-learn==0.14.2",
  "xgboost==3.4.1",
  "joblib==1.5.3",
  "jupyter==1.1.1",
  "pytest==9.0.2",
  "shap==0.52.0",
  "streamlit==1.62.0",
  "ruff==0.14.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
